name: webcraft-ai-agents
region: nyc
services:
  - name: webcraft-agents
    github:
      repo: YOUR_GITHUB_USERNAME/webcraft-agents
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: python main.py
    http_port: 5000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: INSTANTLY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: INSTANTLY_CAMPAIGN_ID
        scope: RUN_TIME
        type: SECRET
      - key: SITESCOUT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DURABLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CALENDLY_LINK
        scope: RUN_TIME
      - key: YOUR_EMAIL
        scope: RUN_TIME
      - key: YOUR_NAME
        scope: RUN_TIME
